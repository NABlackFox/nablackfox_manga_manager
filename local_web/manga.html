<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manga</title>
<style>
  :root { --bg: #0e0e10; --card: #17171a; --ink: #e8e6e1; --dim: #8d8a84; --line: #2a2a2e; --accent: #e0a458; }
  * { box-sizing: border-box; }
  html { background: var(--bg); color: var(--ink); }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); }

  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px;
    padding: 12px 24px; background: rgba(14,14,16,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  header a.back { color: var(--dim); text-decoration: none; white-space: nowrap; }
  header a.back:hover { color: var(--accent); }
  header h1 { margin: 0; font-size: 16px; font-weight: 650; min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--dim); white-space: nowrap; }
  .btn {
    display: inline-block; height: 32px; line-height: 30px; padding: 0 14px; border-radius: 6px; white-space: nowrap;
    background: var(--accent); color: #1a1205; font-weight: 600; text-decoration: none; border: 1px solid var(--accent);
  }
  .btn.ghost { background: #1b1b1f; color: var(--ink); border-color: var(--line); font-weight: 500; }
  .btn:hover { filter: brightness(1.1); }
  .btn.ghost:hover { border-color: var(--accent); filter: none; }

  main { padding: 24px; max-width: 1500px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; align-items: start; }
  a.page { display: block; color: inherit; text-decoration: none; }
  .thumb {
    position: relative; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    aspect-ratio: 2 / 3; transition: transform .15s ease, border-color .15s ease;
  }
  a.page:hover .thumb, a.page:focus-visible .thumb { transform: translateY(-3px); border-color: var(--accent); }
  a.page:focus-visible { outline: none; }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .thumb.loading::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.05) 50%, transparent 70%);
    background-size: 200% 100%; animation: shimmer 1.2s linear infinite;
  }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .chapter {
    position: absolute; left: 6px; top: 6px; padding: 1px 8px; border-radius: 99px; font-size: 11px;
    background: rgba(14,14,16,.85); border: 1px solid var(--accent); color: var(--accent);
  }
  .num { margin-top: 6px; color: var(--dim); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; }
  .num.last { color: var(--accent); }

  .more { text-align: center; padding: 32px 0 80px; }
  .more .hint { color: var(--dim); margin-bottom: 12px; }
  .more .btn { margin: 0 4px; cursor: pointer; font: inherit; font-weight: 500; height: 36px; line-height: 34px; }
  #msg { padding: 100px 0; text-align: center; color: var(--dim); }
</style>
</head>
<body>
<header>
  <a class="back" id="back" href="/">&#8592; Back</a>
  <h1 id="title">Loading...</h1>
  <span class="meta" id="meta"></span>
  <a class="btn ghost" id="restart" href="#" hidden>From the start</a>
  <a class="btn" id="read" href="#" hidden>Read</a>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="more" id="more" hidden>
    <div class="hint" id="hint"></div>
    <button class="btn ghost" id="load10">Load 10 more</button>
    <button class="btn ghost" id="load50">Load 50 more</button>
  </div>
  <div id="msg" hidden></div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const author = params.get("a") || "", manga = params.get("m") || "";
  const query = "a=" + encodeURIComponent(author) + "&m=" + encodeURIComponent(manga);
  const BATCH = 10;
  let pages = [], shown = 0;

  const readUrl = (page) => "/read?" + query + (page ? "&p=" + page : "");

  function addCards(count) {
    const end = Math.min(shown + count, pages.length);
    const frag = document.createDocumentFragment();
    for (let i = shown; i < end; i++) {
      const a = document.createElement("a");
      a.className = "page"; a.href = readUrl(i + 1);
      a.title = "Start reading at page " + (i + 1);

      const box = document.createElement("div");
      box.className = "thumb loading";
      if (pages[i].w && pages[i].h) box.style.aspectRatio = pages[i].w + " / " + pages[i].h;
      const img = document.createElement("img");
      img.alt = ""; img.decoding = "async";
      img.onload = () => box.classList.remove("loading");
      img.onerror = () => { box.classList.remove("loading"); img.remove(); };
      img.src = "/pthumb?" + query + "&i=" + i;
      box.appendChild(img);
      if (pages[i].chapter) {
        const tag = document.createElement("span");
        tag.className = "chapter"; tag.textContent = "Chapter " + pages[i].chapter;
        box.appendChild(tag);
      }
      a.appendChild(box);

      const num = document.createElement("div");
      num.className = "num"; num.textContent = i + 1;
      a.appendChild(num);
      frag.appendChild(a);
    }
    $("grid").appendChild(frag);
    shown = end;

    $("more").hidden = shown >= pages.length;
    $("hint").textContent = "Showing " + shown + " of " + pages.length + " pages";
    $("load50").hidden = pages.length - shown <= BATCH;
  }

  async function start() {
    const res = await fetch("/api/manga?" + query);
    if (!res.ok) throw new Error("missing");
    const data = await res.json();
    pages = data.pages;
    document.title = data.title;
    $("title").textContent = data.title;
    $("title").title = data.title;
    $("back").href = "/author?a=" + encodeURIComponent(author);
    $("meta").textContent = pages.length + " pages";

    const saved = data.progress || {};
    const read = $("read");
    read.hidden = false;
    if (saved.index > 0) {
      read.textContent = "Continue from page " + (saved.index + 1);
      read.href = readUrl(saved.index + 1);
      $("restart").hidden = false;
      $("restart").href = readUrl(1);
    } else {
      read.textContent = "Start reading";
      read.href = readUrl(1);
    }
    addCards(BATCH);
  }

  $("load10").onclick = () => addCards(BATCH);
  $("load50").onclick = () => addCards(50);
  start().catch(() => {
    $("title").textContent = "Not found";
    $("msg").hidden = false;
    $("msg").textContent = "Could not load this manga. Is read mode still running in the terminal?";
  });
})();
</script>
</body>
</html>

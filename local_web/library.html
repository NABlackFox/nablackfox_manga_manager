<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library</title>
<style>
  :root {
    --bg: #0e0e10; --card: #17171a; --ink: #e8e6e1; --dim: #8d8a84;
    --line: #2a2a2e; --accent: #e0a458;
    --hh: 57px; /* header height, used by the letter bar */
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); color: var(--ink); }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); }

  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 16px;
    height: var(--hh); padding: 0 24px; background: rgba(14,14,16,.94); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header a.back { color: var(--dim); text-decoration: none; white-space: nowrap; }
  header a.back:hover { color: var(--accent); }
  .count { color: var(--dim); }
  .spacer { flex: 1; }
  input[type=search] {
    width: min(280px, 45vw); height: 32px; padding: 0 12px;
    background: #1b1b1f; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: inherit;
  }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  main { padding: 24px; max-width: 1500px; margin: 0 auto; }
  /* letter bar + letter sections (authors page only) */
  #jump {
    position: sticky; top: var(--hh); z-index: 4;
    display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 24px;
    background: rgba(14,14,16,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  #jump a {
    min-width: 28px; height: 28px; padding: 0 6px; display: grid; place-items: center;
    border-radius: 6px; color: var(--ink); text-decoration: none; font-weight: 650; font-size: 13px;
  }
  #jump a:hover, #jump a:focus-visible { background: var(--card); color: var(--accent); outline: none; }
  #jump a.off { color: #4a4a50; pointer-events: none; }
  section.group { margin-bottom: 36px; }
  section.group > h2 {
    display: flex; align-items: center; gap: 10px; margin: 0 0 14px;
    font-size: 22px; line-height: 1; color: var(--accent);
  }
  section.group > h2 a { color: inherit; text-decoration: none; }
  section.group > h2 a:hover { text-decoration: underline; }
  section.group > h2 .n { font-size: 12px; font-weight: 400; color: var(--dim); }
  section.group > h2::after { content: ""; flex: 1; border-bottom: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px 16px; }

  a.card { display: block; color: inherit; text-decoration: none; }
  .thumb {
    position: relative; aspect-ratio: 2 / 3; overflow: hidden;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    transition: transform .15s ease, border-color .15s ease;
  }
  a.card:hover .thumb, a.card:focus-visible .thumb { transform: translateY(-3px); border-color: var(--accent); }
  a.card:focus-visible { outline: none; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .initial {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 48px; font-weight: 700; color: #3a3a40;
  }
  .badge {
    position: absolute; right: 8px; top: 8px; padding: 2px 8px; border-radius: 99px;
    background: rgba(14,14,16,.85); border: 1px solid var(--line); font-size: 12px; color: var(--ink);
  }
  .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
  .name {
    margin-top: 8px; font-weight: 550; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    overflow-wrap: anywhere;
  }
  .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  #empty { padding: 80px 0; text-align: center; color: var(--dim); }
</style>
</head>
<body>
<header>
  <a class="back" id="back" href="/" hidden>&#8592; Library</a>
  <h1 id="heading">Library</h1>
  <span class="count" id="count"></span>
  <span class="spacer"></span>
  <input type="search" id="search" placeholder="Filter  ( / )" autocomplete="off">
</header>
<nav id="jump" hidden></nav>
<main>
  <div id="groups"></div>
  <div id="empty" hidden>Nothing matches.</div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const author = params.get("a");
  const enc = encodeURIComponent;

  function card({ href, thumb, name, sub, badge, progress }) {
    const a = document.createElement("a");
    a.className = "card"; a.href = href; a.dataset.name = name.toLowerCase(); a.dataset.title = name;

    const box = document.createElement("div");
    box.className = "thumb";
    const initial = document.createElement("div");
    initial.className = "initial"; initial.textContent = (name.trim()[0] || "?").toUpperCase();
    box.appendChild(initial);
    if (thumb) {
      const img = document.createElement("img");
      img.loading = "lazy"; img.alt = ""; img.src = thumb;
      img.onload = () => initial.remove();
      img.onerror = () => img.remove();
      box.appendChild(img);
    }
    if (badge) { const b = document.createElement("span"); b.className = "badge"; b.textContent = badge; box.appendChild(b); }
    if (progress > 0) { const p = document.createElement("div"); p.className = "bar"; p.style.width = Math.min(progress, 1) * 100 + "%"; box.appendChild(p); }
    a.appendChild(box);

    const title = document.createElement("div"); title.className = "name"; title.textContent = name; title.title = name;
    a.appendChild(title);
    if (sub) { const s = document.createElement("div"); s.className = "sub"; s.textContent = sub; a.appendChild(s); }
    return a;
  }

  // Same rule as the terminal (group_key in utils.py): first letter A-Z, or "#" for numbers/symbols.
  function groupKey(name) {
    const first = name.normalize("NFD")[0] || "";
    return /\p{L}/u.test(first) ? first.toUpperCase() : "#";
  }
  const letterOrder = (a, b) => (a === "#" ? 0 : 1) - (b === "#" ? 0 : 1) || (a < b ? -1 : a > b ? 1 : 0);

  // One section = one author name followed by that author's manga.
  // On an author page there is a single section with no heading.
  let sections = [];
  let letterLinks = new Map();   // letter -> button in the letter bar
  let runId = 0;                 // bumped on every (re)load so stale fetches are ignored

  function makeSection(title, href) {
    const el = document.createElement("section");
    el.className = "group";
    const count = document.createElement("span");
    count.className = "n";
    const grid = document.createElement("div");
    grid.className = "grid";
    if (title !== null) {
      const h = document.createElement("h2");
      const link = document.createElement("a");
      link.href = href; link.textContent = title; link.title = "Open " + title;
      h.append(link, count);
      el.append(h);
    }
    el.append(grid);
    return { el, grid, count, cards: [], loaded: false, title: title || "", key: groupKey(title || "") };
  }

  function render() {
    const needle = $("search").value.trim().toLowerCase();
    let shown = 0, total = 0;
    const letterHasMatch = new Set();

    for (const sec of sections) {
      // typing an author's name shows all of their manga; otherwise match the manga name
      const authorHit = needle && sec.title.toLowerCase().includes(needle);
      let visible = 0;
      for (const c of sec.cards) {
        const match = !needle || authorHit || c.dataset.name.includes(needle);
        c.hidden = !match;
        if (match) visible++;
      }
      shown += visible;
      total += sec.cards.length;
      sec.el.hidden = sec.loaded && visible === 0;   // empty authors / no match: hide
      sec.count.textContent = !sec.loaded ? "loading..." : needle ? visible + " / " + sec.cards.length : sec.cards.length;
      if (visible > 0) letterHasMatch.add(sec.key);
    }
    for (const [k, link] of letterLinks) link.classList.toggle("off", !letterHasMatch.has(k) && sections.every((s) => s.loaded));

    const loading = sections.some((s) => !s.loaded);
    $("empty").textContent = needle ? "Nothing matches." : "No manga found.";
    $("empty").hidden = shown > 0 || loading;
    $("count").textContent = (needle ? shown + " / " + total : total) + (loading ? " ..." : "");
  }

  let queued = false;
  function renderSoon() {            // many authors finish loading at once: draw once per frame
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; render(); });
  }

  function mount(list) {
    const y = window.scrollY;          // rebuilding the page must not throw you back to the top
    sections = list;
    $("groups").replaceChildren(...list.map((sec) => sec.el));
    window.scrollTo(0, y);
  }

  // ---------- remembered state ----------
  // Library data is cached in localStorage and shown instantly; a fresh copy is fetched in
  // the background and the page is only rebuilt if something changed (e.g. reading progress).
  // The scroll position is remembered per tab in sessionStorage.
  const CACHE_KEY = "library-cache-v1";
  const SCROLL_KEY = "scroll:" + location.pathname + location.search;

  function readCache() {
    try {
      const data = JSON.parse(localStorage.getItem(CACHE_KEY));
      return Array.isArray(data) ? data : null;
    } catch (_) { return null; }
  }
  function writeCache(data) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (_) {}
  }
  function saveScroll() {
    try { sessionStorage.setItem(SCROLL_KEY, String(Math.round(window.scrollY))); } catch (_) {}
  }
  function restoreScroll() {
    try {
      const y = Number(sessionStorage.getItem(SCROLL_KEY));
      if (y > 0) window.scrollTo(0, y);
    } catch (_) {}
  }
  history.scrollRestoration = "manual";   // we restore it ourselves, after the content exists
  window.addEventListener("pagehide", saveScroll);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveScroll(); });

  function buildLetterBar() {
    const jump = $("jump");
    jump.replaceChildren();
    letterLinks = new Map();
    const letters = [...new Set(sections.map((sec) => sec.key))].sort(letterOrder);
    for (const k of letters) {
      const link = document.createElement("a");
      link.href = "#"; link.textContent = k;
      link.addEventListener("click", (e) => {
        e.preventDefault();
        const target = sections.find((sec) => sec.key === k && !sec.el.hidden);
        if (!target) return;
        const offset = jump.getBoundingClientRect().bottom + 12;
        window.scrollTo({ top: window.scrollY + target.el.getBoundingClientRect().top - offset, behavior: "smooth" });
      });
      jump.appendChild(link);
      letterLinks.set(k, link);
    }
    jump.hidden = false;
  }

  const sortAuthors = (list) => list.sort((a, b) =>
    letterOrder(groupKey(a.name), groupKey(b.name))
    || a.name.localeCompare(b.name, undefined, { sensitivity: "base", numeric: true }));

  const mangaCards = (authorName, manga) => manga.map((m) => card({
    href: "/manga?a=" + enc(authorName) + "&m=" + enc(m.name),
    thumb: "/thumb?a=" + enc(authorName) + "&m=" + enc(m.name),
    name: m.name,
    sub: m.pages + " pages" + (m.read ? " · page " + m.read : ""),
    progress: m.read / m.pages,
  }));

  function fillSection(sec, authorName, manga) {
    sec.cards = mangaCards(authorName, manga);
    sec.grid.append(...sec.cards);
    sec.loaded = true;
  }

  // What is on screen right now: [{name, manga: [{name, pages, read}]}]
  let shownData = null;

  function showData(data) {
    shownData = data;
    const list = data.map((a) => {
      const sec = makeSection(a.name, "/author?a=" + enc(a.name));
      fillSection(sec, a.name, a.manga);
      return sec;
    });
    mount(list);
    buildLetterBar();
    render();
  }

  // Fetch the whole library. onList(data) / onAuthor(i) let the first-ever load fill in progressively.
  async function fetchAll(id, onList, onAuthor) {
    const authors = await (await fetch("/api/library")).json();
    if (id !== runId) return null;
    const data = sortAuthors(authors).map((a) => ({ name: a.name, manga: [] }));
    if (onList) onList(data);

    let next = 0, complete = true;
    const gone = new Set();             // authors deleted while we were loading
    const worker = async () => {
      while (next < data.length) {
        const i = next++;
        try {
          const res = await fetch("/api/author?a=" + enc(data[i].name));
          if (id !== runId) return;
          if (res.ok) data[i].manga = (await res.json()).manga;
          else if (res.status === 404) gone.add(i);
        } catch (_) { complete = false; }   // a failed author: never cache a partial library
        if (onAuthor) onAuthor(i);
      }
    };
    await Promise.all(Array.from({ length: 6 }, worker));
    return id === runId ? { data: data.filter((_, i) => !gone.has(i)), complete } : null;
  }

  // Fetch fresh data quietly; rebuild the page (keeping the scroll position) only if it changed.
  async function revalidate(id) {
    const res = await fetchAll(id);
    if (!res) return;
    if (res.complete) writeCache(res.data);
    if (JSON.stringify(res.data) !== JSON.stringify(shownData)) showData(res.data);
  }

  async function loadLibrary(id) {
    document.title = "Library";

    const cached = readCache();
    if (cached) {                       // instant: no loading, back where you were
      showData(cached);
      restoreScroll();
      return revalidate(id);
    }

    // very first visit: no cache yet, so fill the sections in as they arrive
    let live = null;
    const res = await fetchAll(
      id,
      (data) => {
        live = data;
        mount(data.map((a) => makeSection(a.name, "/author?a=" + enc(a.name))));
        buildLetterBar();
        render();
      },
      (i) => {
        fillSection(sections[i], live[i].name, live[i].manga);
        renderSoon();
      }
    );
    if (!res) return;
    shownData = res.data;
    if (res.complete) writeCache(res.data);
    render();
    restoreScroll();
  }

  async function loadAuthor(id) {
    const res = await fetch("/api/author?a=" + enc(author));
    if (!res.ok) { $("heading").textContent = "Author not found"; $("empty").hidden = false; $("empty").textContent = "That author folder no longer exists."; return; }
    const data = await res.json();
    if (id !== runId) return;
    document.title = data.name;
    $("heading").textContent = data.name;
    $("back").hidden = false;

    const sec = makeSection(null);
    fillSection(sec, data.name, data.manga);
    mount([sec]);
    render();
    restoreScroll();
  }

  function start() {
    const id = ++runId;
    return author === null ? loadLibrary(id) : loadAuthor(id);
  }

  $("search").addEventListener("input", render);
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== $("search")) { e.preventDefault(); $("search").focus(); }
    else if (e.key === "Escape") { $("search").value = ""; $("search").blur(); render(); }
  });
  // back from the reader: refresh reading progress
  window.addEventListener("pageshow", (e) => {
    if (!e.persisted) return;
    if (author === null) revalidate(++runId); else start();
  });
  start().catch(() => { $("empty").hidden = false; $("empty").textContent = "Could not load. Is read mode still running in the terminal?"; });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manga</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/manga.css">
</head>
<body>
<header class="site-header">
  {{> brand}}
  <nav class="crumbs" aria-label="Breadcrumb">
    <span class="sep">/</span>
    <a id="crumb-author" href="/">Library</a>
    <span class="sep">/</span>
    <span class="here" id="crumb-title">Loading...</span>
  </nav>
  <div class="header-tools">
    {{> nav}}
    <form class="search" action="/" method="get" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="quick-search" name="q" placeholder="Search all manga" aria-label="Search all manga" autocomplete="off">
      <kbd>/</kbd>
    </form>
  </div>
</header>

<main class="page">
  <section class="hero" id="hero" hidden>
    <div class="hero-cover"><img id="cover" alt=""></div>
    <div class="hero-info">
      <p class="eyebrow"><a id="author-link" href="/"></a></p>
      <h1 id="title"></h1>
      <p class="alt-title" id="alt-title" lang="ja" hidden></p>
      <ul class="facts" id="facts"></ul>
      <div class="meter" id="meter" hidden>
        <div class="meter-label"><span>Your progress</span><span id="meter-text"></span></div>
        <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
      </div>
      <div class="actions">
        <a class="btn" id="read" href="#">Start reading</a>
        <a class="btn ghost" id="restart" href="#" hidden>From the start</a>
        <button class="btn ghost" id="bookmark" type="button"><svg class="bm-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.8l6-.8z" stroke-linejoin="round"/></svg><span class="label">Bookmark</span></button>
        <a class="btn ghost" id="goto-mark" href="#" hidden>Go to bookmark</a>
        <button class="btn ghost" id="finish" type="button" hidden>Mark as finished</button>
        <button class="btn ghost" id="reset" type="button" hidden>Mark as unread</button>
      </div>
    </div>
  </section>

  <section class="details" id="tags-section" hidden>
    <h2 class="section-title">Tags</h2>
    <div id="tags"></div>
  </section>

  <section id="pages-section" hidden>
    <h2 class="section-title">Pages <span id="pages-count"></span></h2>
    <div class="thumbs" id="grid"></div>
    <div class="more" id="more" hidden>
      <div class="hint" id="hint"></div>
      <button class="btn ghost" id="load10" type="button">Load 10 more</button>
      <button class="btn ghost" id="loadall" type="button">Load all</button>
    </div>
  </section>

  <div class="state" id="msg" hidden></div>
</main>

{{> footer}}

<script src="/static/js/common.js"></script>
<script src="/static/js/meta.js"></script>
<script src="/static/js/manga.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/library.css">
</head>
<body>
<header class="site-header">
  {{> brand}}
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb" hidden>
    <span class="sep">/</span>
    <span class="here" id="crumb-author"></span>
  </nav>
  <div class="header-tools">
    {{> nav}}
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="search" placeholder="Filter manga or authors" aria-label="Filter" autocomplete="off">
      <kbd>/</kbd>
    </label>
  </div>
</header>

<nav class="jump" id="jump" aria-label="Jump to letter" hidden></nav>

<main class="page">
  <section class="recent" id="recent" hidden>
    <h2 class="group-head"><span>Continue reading</span></h2>
    <div class="rail" id="rail"></div>
  </section>

  <div class="page-title">
    <h1 id="heading">Library</h1>
    <span class="count" id="count"></span>
    <div class="tools" role="group" aria-label="Show">
      <button class="chip" type="button" data-status="all" aria-pressed="true">All</button>
      <button class="chip" type="button" data-status="unread" aria-pressed="false">Unread</button>
      <button class="chip" type="button" data-status="reading" aria-pressed="false">In progress</button>
      <button class="chip" type="button" data-status="done" aria-pressed="false">Finished</button>
      <button class="chip action" type="button" id="random" title="Open a random manga from what is shown (r)">Random</button>
    </div>
  </div>
  <div id="groups"></div>
  <div class="state" id="empty" hidden></div>
</main>

{{> footer}}

<script src="/static/js/common.js"></script>
<script src="/static/js/library.js"></script>
</body>
</html>

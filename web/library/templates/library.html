<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/library.css">
</head>
<body>
<header class="site-header">
  {{> brand}}
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb" hidden>
    <span class="sep">/</span>
    <span class="here" id="crumb-author"></span>
  </nav>
  <div class="header-tools">
    {{> nav}}
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="search" placeholder="Search title, tag, author" aria-label="Search" autocomplete="off"
             title='Words, or tag:glasses  -tag:ahegao  artist:name  pages:>30  year:2021  (press ? for the full list)'>
      <kbd>/</kbd>
    </label>
  </div>
</header>

<nav class="jump" id="jump" aria-label="Jump to letter" hidden></nav>

<main class="page">
  <section class="recent" id="recent" hidden>
    <h2 class="group-head"><span>Continue reading</span></h2>
    <div class="rail" id="rail"></div>
  </section>

  <div class="page-title">
    <h1 id="heading">Library</h1>
    <span class="count" id="count"></span>
    <div class="tools" role="group" aria-label="Show">
      <button class="chip" type="button" data-status="all" aria-pressed="true">All</button>
      <button class="chip" type="button" data-status="unread" aria-pressed="false">Unread</button>
      <button class="chip" type="button" data-status="reading" aria-pressed="false">In progress</button>
      <button class="chip" type="button" data-status="done" aria-pressed="false">Finished</button>
      <button class="chip" type="button" id="tags-toggle" aria-expanded="false" aria-controls="tagpanel" title="Filter by tags (t)">Tags<span class="chip-n" id="tags-n" hidden></span></button>
      <button class="chip action" type="button" id="random" title="Open a random manga from what is shown (r)">Random</button>
    </div>
  </div>
  <section class="tagpanel" id="tagpanel" aria-label="Filter by tags" hidden>
    <div class="tagpanel-top">
      <input type="search" id="tag-find" class="tagfind" placeholder="Find a tag" aria-label="Find a tag" autocomplete="off">
      <div class="tagtypes" id="tag-types" role="group" aria-label="Kind of tag"></div>
      <button class="linklike" id="tag-clear" type="button" hidden>Clear tag filters</button>
    </div>
    <div class="tagcloud" id="tag-list"></div>
    <p class="tagnote" id="tag-note"></p>
    <p class="taghint">Click a tag to show only manga that have it, click again to hide the ones that do, once more to clear it.</p>
  </section>
  <div id="groups"></div>
  <div class="state" id="empty" hidden></div>
</main>

{{> footer}}

<script src="/static/js/common.js"></script>
<script src="/static/js/meta.js"></script>
<script src="/static/js/tags.js"></script>
<script src="/static/js/library.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manga</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/manga.css">
</head>
<body>
<header class="site-header">
  {{> brand}}
  <nav class="crumbs" aria-label="Breadcrumb">
    <span class="sep">/</span>
    <a id="crumb-author" href="/">Library</a>
    <span class="sep">/</span>
    <span class="here" id="crumb-title">Loading...</span>
  </nav>
</header>

<main class="page">
  <section class="hero" id="hero" hidden>
    <div class="hero-cover"><img id="cover" alt=""></div>
    <div class="hero-info">
      <p class="eyebrow"><a id="author-link" href="/"></a></p>
      <h1 id="title"></h1>
      <ul class="facts" id="facts"></ul>
      <div class="meter" id="meter" hidden>
        <div class="meter-label"><span>Your progress</span><span id="meter-text"></span></div>
        <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
      </div>
      <div class="actions">
        <a class="btn" id="read" href="#">Start reading</a>
        <a class="btn ghost" id="restart" href="#" hidden>From the start</a>
      </div>
    </div>
  </section>

  <section id="pages-section" hidden>
    <h2 class="section-title">Pages <span id="pages-count"></span></h2>
    <div class="thumbs" id="grid"></div>
    <div class="more" id="more" hidden>
      <div class="hint" id="hint"></div>
      <button class="btn ghost" id="load10" type="button">Load 10 more</button>
      <button class="btn ghost" id="load50" type="button">Load 50 more</button>
    </div>
  </section>

  <div class="state" id="msg" hidden></div>
</main>

{{> footer}}

<script src="/static/js/common.js"></script>
<script src="/static/js/manga.js"></script>
</body>
</html>
